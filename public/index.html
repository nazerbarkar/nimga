<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Generate stunning AI images and videos with your Nimiq wallet.">
  <title>NIMGA — AI Image & Video Generation</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,400;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@nimiq/hub-api@v1.10.0/dist/standalone/HubApi.standalone.umd.js"></script>
</head>
<body>
  <div class="ambient-bg">
    <div class="ambient-orb orb1"></div>
    <div class="ambient-orb orb2"></div>
    <div class="ambient-orb orb3"></div>
  </div>

  <div class="showcase-images">
    <img class="showcase-img si-1" src="/images/showcase-1.png" alt="">
    <img class="showcase-img si-2" src="/images/showcase-2.png" alt="">
    <img class="showcase-img si-3" src="/images/showcase-3.png" alt="">
    <img class="showcase-img si-4" src="/images/showcase-4.png" alt="">
  </div>

  <div class="app">
    <header class="header">
      <div class="header-left">
        <a href="/" class="logo-link"><img src="img/logo.svg" alt="NIMGA" class="logo-img"></a>
      </div>
      <div class="header-right">
        <div id="user-area" class="user-area hidden">
          <button id="history-btn" class="btn-history" title="My creations">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span>My Creations</span>
          </button>
          <span class="credit-pill" id="credit-pill" title="Credits">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
            <span id="credit-count">0</span>
          </span>
          <button id="add-credits-btn" class="btn-add-credits" title="Add credits">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <div class="wallet-badge">
            <div class="wallet-dot"></div>
            <span id="wallet-short"></span>
          </div>
          <button id="logout-btn" class="btn-icon" title="Log out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
        <button id="connect-btn" class="btn-connect">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Connect wallet
        </button>
      </div>
    </header>

    <main class="main">
      <section class="hero">
        <h1 class="hero-title">What are you<br><span class="text-accent">Dreaming</span> to create?</h1>

        <div class="creator-card">
          <div class="agent-selector">
            <button class="agent-btn active" data-type="text-to-image">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
              <span><strong>Text to Image</strong><br><small>Agent</small></span>
            </button>
            <button class="agent-btn" data-type="text-to-video">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="15" height="16" rx="2"/><path d="m17 8 5-4v16l-5-4z"/></svg>
              <span><strong>Text to Video</strong><br><small>Agent</small></span>
            </button>
            <button class="agent-btn" data-type="image-to-video">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="15" height="16" rx="2"/><path d="m17 8 5-4v16l-5-4z"/><rect x="3" y="3" width="7" height="7" rx="1" transform="translate(8 11)"/></svg>
              <span><strong>Image to Video</strong><br><small>Agent</small></span>
            </button>
          </div>

          <div class="upload-area hidden" id="upload-area">
            <input type="file" id="image-input" accept="image/*" hidden>
            <div class="upload-placeholder" id="upload-placeholder">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
              <span>Upload or Drag Image Here</span>
            </div>
            <div class="upload-preview hidden" id="upload-preview">
              <img id="preview-img" src="" alt="Preview">
              <button class="upload-remove" id="upload-remove">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
          </div>

          <div class="create-box">
            <textarea id="prompt-input" placeholder="Describe what you want to create..." rows="1"></textarea>
            <button id="generate-btn" class="btn-generate" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>

          <div class="credit-hint" id="create-hint"></div>
        </div>
      </section>

      <div id="generating-indicator" class="generating-indicator hidden">
        <div class="gen-shimmer"></div>
        <div class="gen-status"><span id="gen-status-text">Creating your image</span><div class="gen-dots"><span></span><span></span><span></span></div></div>
      </div>

      <div id="result-area" class="result-area hidden">
        <div class="result-media-wrap">
          <img id="result-image" class="result-image hidden" src="" alt="Generated image">
          <video id="result-video" class="result-video hidden" controls src=""></video>
        </div>
        <div class="result-actions">
          <a id="download-btn" class="btn-download" download="nimga-image.png">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download
          </a>
          <button id="new-btn" class="btn-new">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Creation
          </button>
        </div>
      </div>
    </main>
  </div>

  <div id="buy-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add Credits</h2>
        <button id="close-modal" class="btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-balance"><strong id="modal-balance">0</strong> credits</div>
        <p class="modal-desc">Select a package. Pay with Nimiq Hub.</p>
        <div id="packages" class="packages"></div>
        <div id="payment-progress" class="payment-progress hidden">
          <div class="payment-spinner"></div>
          <div class="payment-text">
            <strong id="pay-status-title">Opening Nimiq Hub...</strong>
            <p id="pay-status-msg">Complete the payment in the Nimiq checkout window.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="history-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-wide">
      <div class="modal-header">
        <h2>My Creations</h2>
        <button id="close-history" class="btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="history-grid" class="history-grid">
          <div class="gallery-empty">No creations yet.</div>
        </div>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <button id="lightbox-close" class="lightbox-close">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <img id="lightbox-img" class="lightbox-img hidden" src="" alt="Full size image">
    <video id="lightbox-video" class="lightbox-video hidden" controls src=""></video>
    <div id="lightbox-prompt" class="lightbox-prompt"></div>
    <div class="lightbox-actions">
      <a id="lightbox-download" class="btn-download" download="nimga-image.png">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </a>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="js/app.js"></script>
</body>
</html>
